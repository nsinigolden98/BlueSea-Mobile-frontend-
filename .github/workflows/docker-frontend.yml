# Build + push the frontend image and roll the VPS `web` stack.
# Triggers on main only. Placeholders to fill:
#   - REGISTRY_OWNER_PLACEHOLDER below -> your GHCR org/user (lowercase).
#   - VITE_API_BASE_PLACEHOLDER -> https://API_DOMAIN_PLACEHOLDER
#   - Repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.

name: docker-frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/REGISTRY_OWNER_PLACEHOLDER/bluesea-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE=VITE_API_BASE_PLACEHOLDER
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/bluesea-frontend
            docker compose -f docker-compose.frontend.yml pull web
            docker compose -f docker-compose.frontend.yml up -d web
            docker image prune -f
