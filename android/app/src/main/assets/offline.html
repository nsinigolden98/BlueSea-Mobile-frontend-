<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline | BlueSea Mobile</title>
  <style>
    :root {
      --bg-gradient-from: #f8fafc;
      --bg-gradient-to: #e2e8f0;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-primary: #0284c7;
      --brand-hover: #0369a1;
      --brand-light: #e0f2fe;
      --border-color: #e2e8f0;
      --shadow-color: rgba(15, 23, 42, 0.08);
      --badge-offline-bg: #fef2f2;
      --badge-offline-text: #ef4444;
      --badge-online-bg: #f0fdf4;
      --badge-online-text: #16a34a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-gradient-from: #0f172a;
        --bg-gradient-to: #1e293b;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --brand-primary: #38bdf8;
        --brand-hover: #0284c7;
        --brand-light: rgba(56, 189, 248, 0.15);
        --border-color: #334155;
        --shadow-color: rgba(0, 0, 0, 0.4);
        --badge-offline-bg: rgba(239, 68, 68, 0.15);
        --badge-offline-text: #f87171;
        --badge-online-bg: rgba(22, 163, 74, 0.15);
        --badge-online-text: #4ade80;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-gradient-from), var(--bg-gradient-to));
      color: var(--text-main);
      padding: 24px;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 25px -5px var(--shadow-color), 0 8px 10px -6px var(--shadow-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      background: var(--badge-offline-bg);
      color: var(--badge-offline-text);
      transition: all 0.3s ease;
    }

    .status-badge.online {
      background: var(--badge-online-bg);
      color: var(--badge-online-text);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .pulse {
      animation: pulseAnimation 1.5s infinite;
    }

    @keyframes pulseAnimation {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .icon-container {
      width: 88px;
      height: 88px;
      background: var(--brand-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--brand-primary);
    }

    .icon-container svg {
      width: 44px;
      height: 44px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .btn-retry {
      width: 100%;
      height: 52px;
      background: var(--brand-primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .btn-retry:active {
      transform: scale(0.98);
      background: var(--brand-hover);
    }

    .btn-retry:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="badge" class="status-badge">
      <span class="status-dot pulse"></span>
      <span id="badge-text">No Connection</span>
    </div>

    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a5 5 0 010-7.072m0 0L5.636 5.636m0 0L3 3m3.536 12.728a9 9 0 010-12.728" />
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>Please check your internet connection. We will automatically reconnect you once network access is restored.</p>

    <button id="retry-btn" class="btn-retry" onclick="executeRetry()">
      <span id="spinner" class="spinner"></span>
      <span id="btn-text">Retry Connection</span>
    </button>
  </div>

  <div id="toast" class="toast">Still offline. Please check your signal.</div>

  <script>
    var isChecking = false;

    function getTargetUrl() {
      if (window.AndroidBridge && typeof window.AndroidBridge.getLastVisitedUrl === 'function') {
        var savedUrl = window.AndroidBridge.getLastVisitedUrl();
        if (savedUrl && savedUrl.indexOf('http') === 0) {
          return savedUrl;
        }
      }
      return 'https://blueseamobile.com.ng/dashboard';
    }

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 3000);
    }

    function setBtnLoading(loading) {
      var btn = document.getElementById('retry-btn');
      var spinner = document.getElementById('spinner');
      var btnText = document.getElementById('btn-text');

      isChecking = loading;
      btn.disabled = loading;
      if (loading) {
        spinner.style.display = 'block';
        btnText.innerText = 'Connecting...';
      } else {
        spinner.style.display = 'none';
        btnText.innerText = 'Retry Connection';
      }
    }

    function executeRetry() {
      if (isChecking) return;
      setBtnLoading(true);

      if (!navigator.onLine) {
        setTimeout(function() {
          setBtnLoading(false);
          showToast('Still offline. Check cellular or Wi-Fi data.');
        }, 800);
        return;
      }

      if (window.AndroidBridge && typeof window.AndroidBridge.retryConnection === 'function') {
        window.AndroidBridge.retryConnection();
      } else {
        window.location.href = getTargetUrl();
      }
    }

    window.addEventListener('online', function() {
      var badge = document.getElementById('badge');
      var badgeText = document.getElementById('badge-text');
      badge.classList.add('online');
      badgeText.innerText = 'Network Restored';
      showToast('Network restored. Reconnecting...');
      
      setTimeout(function() {
        executeRetry();
      }, 1200);
    });
  </script>
</body>
</html>
